<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#28382f">
    <meta name="color-scheme" content="dark">
    <title>Readi World</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./src/styles.css?v=i2-floating-joystick">
  </head>
  <body>
    <main id="app" class="app-shell" aria-label="Readi World">
      <canvas id="world-canvas" aria-label="Bejárható játékvilág"></canvas>
      <header class="top-hud" aria-label="Játékállapot">
        <div class="brand-mark" aria-hidden="true">🌲</div>
        <div class="hud-copy">
          <strong>Readi World</strong>
          <span id="runtime-status">A világ betöltése…</span>
        </div>
        <div class="resource-pill" aria-label="Összegyűjtött fa">
          <span aria-hidden="true">🪵</span>
          <strong id="wood-count">0/3</strong>
        </div>
        <div class="resource-pill crafted-resource" aria-label="Elkészített javítógerenda">
          <span aria-hidden="true">🛠️</span>
          <strong id="repair-timber-count">0/1</strong>
        </div>
      </header>
      <section class="objective-card" aria-live="polite">
        <span class="objective-label">Első helyreállítás</span>
        <strong id="objective-text">Keresd meg az erdei ágakat</strong>
      </section>
      <div id="context-prompt" class="context-prompt" data-state="idle" aria-live="polite">
        Mozogj közelebb egy kiemelt célponthoz
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <section id="milestone-banner" class="milestone-banner" aria-live="assertive">
        <span class="milestone-sparkles" aria-hidden="true">✨ 🌿 ✨</span>
        <strong>Forester’s Hut helyreállítva!</strong>
        <span>Faluszint 1 · A farmhoz vezető ösvény megnyílt</span>
      </section>
      <div id="joystick-zone" class="joystick-zone" aria-label="Jobb oldali érintési mozgászóna">
        <div id="joystick" class="joystick" role="application" aria-label="Floating virtuális joystick" aria-hidden="true">
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
      </div>
    </main>
    <noscript>A Readi World futtatásához engedélyezni kell a JavaScriptet.</noscript>
    <script type="module" src="./src/bootstrap.js?v=fix-player-placeholder-body"></script>
  </body>
</html>
