<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Readi Asset Prep</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
  </head>
  <body>
    <header>
      <div class="eyebrow">READI WORLD • ART-TOOL-01A</div>
      <h1>Readi Asset Prep</h1>
      <p>Profile-driven Photoshop normalization. Never writes to runtime.</p>
    </header>

    <section class="warning" id="owner-warning" hidden>
      This family profile is still under owner review. Tooling proof only.
    </section>

    <section>
      <h2>Profile</h2>
      <label>Family <input id="family" readonly></label>
      <label>Output
        <select id="output"></select>
      </label>
      <label>Asset ID <input id="asset-id" readonly></label>
      <div class="grid two">
        <label>Master revision <input id="revision" value="r001"></label>
        <label>Prompt Run ID <input id="prompt-run" value="TODO"></label>
      </div>
      <div class="facts" id="profile-facts"></div>
    </section>

    <section>
      <h2>Document</h2>
      <div class="button-grid">
        <button id="create-document">Create From Profile</button>
        <button id="validate-document">Validate Active Document</button>
        <button id="apply-color">Apply RGB / 8-bit / sRGB</button>
        <button id="set-canvas">Set Canvas Without Scaling</button>
        <button id="create-groups">Create Standard Layer Groups</button>
        <button id="create-guides">Create Pivot + Padding Guides</button>
      </div>
    </section>

    <section>
      <h2>Export & metadata</h2>
      <div class="button-grid">
        <button id="export-normalized">Export Normalized PNG</button>
        <button id="export-review">Export Review PNG</button>
        <button id="write-geometry">Write Geometry Sidecar</button>
        <button id="write-passport">Create Passport Draft</button>
      </div>
      <div class="memory" id="memory"></div>
    </section>

    <section class="status-section">
      <h2>Status</h2>
      <pre id="status" aria-live="polite">Loading bundled profile…</pre>
    </section>
  </body>
</html>
