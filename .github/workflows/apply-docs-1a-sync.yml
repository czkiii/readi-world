name: Apply docs 1A sync

on:
  push:
    paths:
      - '.sync-temp/docs-1A.tar.gz.b64'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply docs 1A sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract docs 1A
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .sync-temp/docs-1A.tar.gz.b64 > /tmp/docs-1A.tar.gz
          tar -xzf /tmp/docs-1A.tar.gz
          rm .sync-temp/docs-1A.tar.gz.b64
      - name: Commit synced docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .sync-temp/docs-1A.tar.gz.b64
          git commit -m "Apply docs 1A sync"
          git push
